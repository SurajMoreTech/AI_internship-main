# ─────────────────────────────────────────────────────────────────────────────
# secrets.example.toml — TEMPLATE ONLY. Copy real values into
# .streamlit/secrets.toml (gitignored) locally, or into the Streamlit
# Community Cloud "Secrets" dashboard when deployed. NEVER commit real values.
# ─────────────────────────────────────────────────────────────────────────────

# ── Groq (existing) ──────────────────────────────────────────────────────────
GROQ_API_KEY = "gsk_..."

# ── Local mode identity (OPTIONAL) ──────────────────────────────────────────
# When Google Sign-In isn't wired up for localhost, the app runs in "local
# mode". Set your name/email here and they show in the sidebar instead of the
# "not configured" banner, so the app is fully usable offline. Cloud saving
# still stays off in local mode. Equivalent env vars: LOCAL_USER_NAME,
# LOCAL_USER_EMAIL. This file is gitignored — nothing here is committed.
[local_user]
name = "Your Name"
email = "you@example.com"

# ── Google Sign-In via Streamlit native OIDC (st.login) ─────────────────────
# From Google Cloud Console → APIs & Services → Credentials →
# "OAuth 2.0 Client ID" (type: Web application).
# NOTE: a Firebase project IS a Google Cloud project — create the OAuth
# client in the SAME project you enabled Firebase on.
#
# Authorized redirect URI must be EXACTLY:
#   local:    http://localhost:8501/oauth2callback
#   deployed: https://<your-app>.streamlit.app/oauth2callback
#
# cookie_secret: any long random string YOU generate (e.g.
#   python -c "import secrets; print(secrets.token_hex(32))")
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "REPLACE_WITH_LONG_RANDOM_STRING"
client_id = "1234567890-xxxxxxxx.apps.googleusercontent.com"
client_secret = "GOCSPX-..."
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# ── Firebase service account (SECRET — server-side Firestore access) ────────
# Firebase Console → Project settings → Service accounts →
# "Generate new private key" → paste the JSON fields below.
# This is a real credential: never hardcode, never log, never render,
# never commit. The private_key keeps its literal \n escapes inside one
# TOML string exactly as in the downloaded JSON.
[firebase_service_account]
type = "service_account"
project_id = "your-project-id"
private_key_id = "..."
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = "firebase-adminsdk-xxxxx@your-project-id.iam.gserviceaccount.com"
client_id = "..."
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/firebase-adminsdk-xxxxx%40your-project-id.iam.gserviceaccount.com"
universe_domain = "googleapis.com"
